services:
  web:
    build: .
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aethergate}
      POSTGRES_USER: ${POSTGRES_USER:-aethergate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aethergate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"

  redis:
    image: redis:7
    ports:
      - "0.0.0.0:6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aethergate.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "0.0.0.0:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "0.0.0.0:5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

volumes:
  pgdata:
  pgadmin_data:
  redisinsight_data:
