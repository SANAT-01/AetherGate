[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[project]
name = "aethergate"
version = "0.1.0"
description = "Multi-tenant AI FinOps & smart routing gateway — a self-hosted, OpenAI-compatible LLM proxy with semantic caching, provider fallback, and per-tenant budget enforcement."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: Django :: 5.0",
    "Private :: Do Not Upload",
]
dependencies = [
    "django>=5.0,<5.1",
    "django-ninja>=1.3,<1.4",
    "psycopg[binary]>=3.1,<3.3",
    "pgvector>=0.3,<0.4",
    "httpx>=0.27,<0.28",
    "redis>=6.1,<7.0",  # kombu's Redis transport (Celery) requires redis-py >= 6.1.0
    "pydantic>=2.7,<3.0",
    "django-environ>=0.11,<0.12",
    "uvicorn[standard]>=0.30,<0.31",
    "cryptography>=42.0,<43.0",
    "celery>=5.4,<5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0,<6.0",
    "respx>=0.21,<0.22",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<2.0",
    "django-stubs[compatible-mypy]>=5.0,<6.0",
    "django-stubs-ext>=5.0,<6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["RUF012"]  # Django Meta.constraints/indexes and migrations use mutable class-level lists idiomatically

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # star imports are the standard Django settings-split idiom

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["migrations/"]
# django-environ and pgvector ship no type stubs / py.typed marker — not fixable from our side.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
asyncio_mode = "auto"
