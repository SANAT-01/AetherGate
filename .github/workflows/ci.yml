name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aethergate
          POSTGRES_USER: aethergate
          POSTGRES_PASSWORD: aethergate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://aethergate:aethergate@localhost:5432/aethergate
      REDIS_URL: redis://localhost:6379/0
      FREELLMAPI_BASE_URL: https://example.invalid
      FREELLMAPI_TOKEN: ci-dummy-token
      FIELD_ENCRYPTION_KEY: anapnPIS0kXQl3oX-v5TdGAMb9UVYpuC7CiSMxUxsyc=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy apps config

      - name: Migrate
        run: python manage.py migrate

      - name: Test
        run: pytest --cov
